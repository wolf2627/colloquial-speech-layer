<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colloquial Speech Layer - Model Tester</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎯 Colloquial Speech Layer</h1>
            <p class="subtitle">Model Testing Interface</p>
        </header>

        <div class="control-bar">
            <div class="form-group">
                <label for="model-select">Select Model</label>
                <select id="model-select">
                    <option value="">Loading models...</option>
                </select>
            </div>
            <button id="submit-btn" class="btn-primary">
                <span class="btn-text">Send</span>
                <span class="btn-loader" hidden>...</span>
            </button>
        </div>

        <main class="panels">
            <div class="panel input-panel">
                <div class="panel-header">
                    <h2>Input</h2>
                </div>
                <textarea id="user-input" placeholder="Enter your text here..."></textarea>
            </div>

            <div class="panel output-panel">
                <div class="panel-header">
                    <h2>Output</h2>
                    <div class="header-right">
                        <span id="model-info" class="model-info" hidden></span>
                        <button id="copy-btn" class="btn-secondary" hidden>Copy</button>
                    </div>
                </div>
                <div id="output-content" class="output-content">
                    <p class="placeholder">Response will appear here...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>API Status: <span id="api-status" class="status-indicator">Checking...</span></p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
